name: Dispatch EE Index Pipeline

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream repo's index pipeline
        if: vars.EE_INDEX_REPO != '' && vars.EE_INDEX_WORKFLOW != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EE_INDEX_DISPATCH_TOKEN }}
        run: |
          gh workflow run "${{ vars.EE_INDEX_WORKFLOW }}" \
            --repo "${{ vars.EE_INDEX_REPO }}" \
            --ref master
